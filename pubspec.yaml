name: pcut9
description: "Pro 9 Studio — CCTV Video Editor & Automated Report Generator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.0.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  desktop_drop: ^0.5.0
  file_picker: ^9.2.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/images/app_icon_cut.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/app_icon_cut.png
    - assets/images/app_icon_cut.jpg
    - assets/app_icon_cut.png
    - assets/app_icon_cut.jpg
    - assets/videos/intro.mp4
    - assets/videos/outro_bg.mp4
    - assets/bin/ffmpeg.exe
